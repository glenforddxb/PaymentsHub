<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - Software Development Document Environment</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <style>
        body { background-color: #f4f6f9; }
        .login-container { max-width: 450px; margin-top: 100px; }
    </style>
</head>
<body>
<div class="container login-container">
    <div class="card shadow-lg">
        <div class="card-header bg-primary text-white text-center py-3">
            <h4>Software Development Document Environment</h4>
        </div>
        <div class="card-body p-4">
            <div th:if="${param.error}" class="alert alert-danger" role="alert">
                Invalid Username or Password. Please try again.
            </div>
            <div th:if="${param.logout}" class="alert alert-success" role="alert">
                You have been logged out successfully.
            </div>
            <div th:if="${param.registered}" class="alert alert-success" role="alert">
                Account successfully created! You can now log in.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" id="username" name="username" class="form-control" required placeholder="Enter username">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="form-control" required placeholder="Enter password">
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2">Sign In</button>
            </form>
            <div class="text-center mt-3">
                <a href="/register" class="btn btn-outline-secondary btn-sm w-100">Create New Maker Account</a>
            </div>
        </div>
        <div class="card-footer text-muted text-center py-3 bg-light">
            <small>Demo Accounts:<br>Admin: <b>admin</b> / <b>password</b><br>Maker: <b>maker</b> / <b>password</b><br>Checker: <b>checker</b> / <b>password</b></small>
        </div>
    </div>
</div>
</body>
</html>
