# Software Development Document Environment Configuration
spring:
  application:
    name: Software Development Document Environment
  profiles:
    active: default
  datasource:
    url: jdbc:h2:mem:sdmdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: password
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Swagger / OpenAPI config
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha

# Application-specific Custom Configurations
app:
  name: Software Development Document Environment
  watch-folder: ./ingestion-watcher
  upload-dir: ./uploads
  notifications-enabled: false
  sms-enabled: false
  email-enabled: false
  maker-checker-enabled: true
  ldap:
    enabled: false
    url: ldap://localhost:389
    base: dc=cth,dc=com
    user-dn-pattern: uid={0},ou=people
    manager-dn: cn=admin,dc=cth,dc=com
    manager-password: adminpassword

---
# PostgreSQL Configuration Profile
spring:
  config:
    activate:
      on-profile: postgresql
  datasource:
    url: jdbc:postgresql://localhost:5432/sdmdb
    username: postgres
    password: dbpassword
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update

---
# Oracle Configuration Profile
spring:
  config:
    activate:
      on-profile: oracle
  datasource:
    url: jdbc:oracle:thin:@localhost:1521:ORCL
    username: sdm_admin
    password: dbpassword
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: update

---
# SQL Server Configuration Profile
spring:
  config:
    activate:
      on-profile: sqlserver
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=sdmdb;encrypt=true;trustServerCertificate=true
    username: sa
    password: dbpassword
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: update
